[build]
  command = "npm run build"
  publish = "dist"
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
